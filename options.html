<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>DeepL Pro Unlimited – Settings</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <style>
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: #f8f9fa;
            }
            .settings-card {
                max-width: 720px;
                margin: 40px auto;
                padding: 32px;
                background: #fff;
                border-radius: 12px;
                box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            }
            .form-check-input:checked {
                background-color: #0d6efd;
                border-color: #0d6efd;
            }
        </style>
    </head>
    <body>
        <div class="settings-card">
            <h1 class="h3 mb-1 text-primary fw-bold">
                <i class="bi bi-gear-fill me-2"></i>Settings
            </h1>
            <p class="text-muted mb-4">DeepL Pro Unlimited – Long Texts Without Limits</p>

            <h2 class="h6 fw-semibold mb-2">Anonymous usage data</h2>
            <p class="small text-muted mb-3">
                Helps us see which features are useful and which aren't. We never collect translated text, files, or
                personal data. Data is stored on EU servers (PostHog).
                <a id="privacyLink" href="#" target="_blank" rel="noopener">Privacy policy</a>.
            </p>
            <div class="form-check form-switch fs-5 mb-2">
                <input class="form-check-input" type="checkbox" role="switch" id="analyticsToggle" />
                <label class="form-check-label small" for="analyticsToggle" id="analyticsToggleLabel">
                    Loading…
                </label>
            </div>
            <div id="status" class="small text-success" aria-live="polite"></div>
        </div>

        <script src="track.js"></script>
        <script src="options.js"></script>
    </body>
</html>
