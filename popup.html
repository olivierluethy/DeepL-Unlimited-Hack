<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <title>DeepL Pro Unlimited</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="js/jspdf.umd.min.js" defer></script>

        <style>
            body {
                width: 600px;
                padding: 20px;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }
            .loop-entry {
                border: 1px solid #dee2e6;
                border-radius: 8px;
                padding: 15px;
                margin-bottom: 15px;
                background-color: #f8f9fa;
                transition: box-shadow 0.2s;
            }
            .loop-entry:hover {
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
            .entry-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
            }
            .entry-header h3 {
                margin: 0;
                font-size: 1.25rem;
                font-weight: 600;
            }
            .sub-entry {
                margin: 10px 0;
                padding: 10px;
                border-left: 3px solid #0d6efd;
                background-color: #fff;
                border-radius: 4px;
            }
            .sub-entry-text {
                max-height: none; /* Keine Begrenzung mehr */
                overflow: visible; /* Vollständig anzeigen */
                position: relative;
                font-size: 1rem; /* etwas größere Schrift für bessere Lesbarkeit */
                line-height: 1.4;
                white-space: normal; /* Zeilenumbruch normal */
            }
            .sub-entry-text.expanded {
                max-height: none;
            }
            .sub-entry-text.expanded::after {
                display: none;
            }
            .toggle-text {
                color: #0d6efd;
                cursor: pointer;
                font-size: 0.85rem;
                margin-top: 5px;
                display: inline-block;
            }
            .input-group textarea {
                resize: vertical;
                min-height: 60px;
            }
            .actions button {
                margin-left: 5px;
            }
            #entriesContainer {
                max-height: 400px;
                overflow-y: auto;
                padding-right: 10px;
            }
            .view-page-btn {
                background: linear-gradient(135deg, #0d6efd, #6610f2);
                color: #fff;
                font-weight: 600;
                border: none;
                border-radius: 50px;
                padding: 0.45rem 1.2rem;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s,
                    filter 0.2s;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
                font-size: 0.9rem;
            }

            .view-page-btn:hover {
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
                filter: brightness(1.1);
            }

            .view-page-btn:active {
                transform: translateY(1px) scale(0.98);
                box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            }

            .view-page-btn:focus {
                outline: none;
                box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.3);
            }
            .history-entry pre {
                background-color: #f8f9fa;
                border: 1px solid #e9ecef;
                border-radius: 4px;
                padding: 8px;
                font-size: 0.85rem;
                white-space: pre-wrap; /* Erlaubt Zeilenumbrüche */
                word-wrap: break-word; /* Bricht lange Wörter */
                max-height: 150px; /* Maximale Höhe bevor Scrollbar erscheint */
                overflow-y: auto; /* Vertikale Scrollbar */
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </head>
    <body>
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2 class="text-primary mb-0 fw-bold">DeepL Pro Unlimited</h2>

            <div class="d-flex gap-2">
                <!-- Report Bug Button -->
                <button id="bugBtn" class="btn btn-outline-danger btn-sm d-flex align-items-center">
                    <svg
                        xmlns="http://www.w3.org"
                        width="14"
                        height="14"
                        fill="currentColor"
                        class="bi bi-bug me-2"
                        viewBox="0 0 16 16"
                    >
                        <path
                            d="M4.355.522a.5.5 0 0 1 .623.333l.291.956A4.905 4.905 0 0 1 8 1c1.007 0 1.946.303 2.73.823l.292-.956a.5.5 0 1 1 .956.291l-.279.916c.59.416 1.057.973 1.353 1.631l.845-.423a.5.5 0 0 1 .447.894l-.823.411c.249.42.408.897.462 1.405l.942.213a.5.5 0 1 1-.22.975l-.943-.214a5.074 5.074 0 0 1-.135 1.026l.893.447a.5.5 0 1 1-.447.894l-.893-.447a5.09 5.09 0 0 1-.746 1.168l.86.86a.5.5 0 0 1-.707.707l-.86-.86a5.07 5.07 0 0 1-1.026.541l.213.943a.5.5 0 0 1-.975.22l-.214-.943a4.913 4.913 0 0 1-1.558 0l-.214.943a.5.5 0 1 1-.975-.22l.213-.943a5.07 5.07 0 0 1-1.026-.541l-.86.86a.5.5 0 1 1-.707-.707l.86-.86a5.09 5.09 0 0 1-.746-1.168l-.893.447a.5.5 0 1 1-.447-.894l.893-.447a5.074 5.074 0 0 1-.135-1.026l-.943.214a.5.5 0 1 1-.22-.975l.942-.213A5.07 5.07 0 0 1 2 6c0-.508.153-.985.402-1.405l-.823-.411a.5.5 0 0 1 .447-.894l.845.423a4.905 4.905 0 0 1 1.353-1.631l-.279-.916a.5.5 0 0 1 .333-.623zM4.5 6v2a3.5 3.5 0 0 0 7 0V6a3.5 3.5 0 0 0-7 0"
                        />
                    </svg>
                    Bug
                </button>

                <!-- Feature Request Button -->
                <button id="featureBtn" class="btn btn-outline-info btn-sm d-flex align-items-center">
                    <svg
                        xmlns="http://www.w3.org"
                        width="14"
                        height="14"
                        fill="currentColor"
                        class="bi bi-lightbulb me-2"
                        viewBox="0 0 16 16"
                    >
                        <path
                            d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13h-5a.5.5 0 0 1-.46-.302l-.761-1.77a1.964 1.964 0 0 0-.453-.618A5.984 5.984 0 0 1 2 6m6-5a5 5 0 0 0-3.479 8.592c.263.254.514.564.676.941L5.83 12h4.342l.632-1.467c.162-.377.413-.687.676-.941A5 5 0 0 0 8 1"
                        />
                        <path
                            d="M7.703 14.962a.75.75 0 0 1 .594 0l.334.148c.307.136.324.555.059.716a1.27 1.27 0 0 1-1.38 0c-.265-.16-.248-.58.058-.716l.335-.148ZM5.5 14a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 0 1H6a.5.5 0 0 1-.5-.5"
                        />
                    </svg>
                    Feature
                </button>

                <!-- View on Page Button -->
            </div>
        </div>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-3" id="appTabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="main-tab" data-bs-toggle="tab" href="#main" role="tab">Main</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="loop-tab" data-bs-toggle="tab" href="#loop" role="tab">Batch Translator</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="history-tab" data-bs-toggle="tab" href="#history" role="tab">History</a>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Main Page -->
            <div class="tab-pane fade show active" id="main" role="tabpanel">
                <div class="mb-3">
                    <label for="inputText" class="form-label">Enter text:</label>
                    <textarea
                        class="form-control"
                        id="inputText"
                        rows="6"
                        placeholder="Enter your text here..."
                    ></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <!-- Gruppe 1: Textwerkzeuge -->
                    <div class="d-flex gap-1">
                        <!-- Paste Button -->
                        <button
                            class="btn btn-outline-secondary btn-sm"
                            id="pasteBtn"
                            title="Paste text from your clipboard directly into the input field."
                            aria-label="Paste text from clipboard"
                        >
                            <svg
                                xmlns="http://www.w3.org"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-clipboard-plus"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    fill-rule="evenodd"
                                    d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7z"
                                />
                                <path
                                    d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"
                                />
                                <path
                                    d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"
                                />
                            </svg>
                            Paste
                        </button>

                        <!-- Copy Button -->
                        <button
                            class="btn btn-outline-secondary btn-sm"
                            id="copyInputBtn"
                            title="Copy the current content of the input field to your clipboard."
                            aria-label="Copy input text"
                        >
                            <svg
                                xmlns="http://www.w3.org"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-clipboard"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"
                                />
                                <path
                                    d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"
                                />
                            </svg>
                            Copy
                        </button>

                        <!-- Clear Button -->
                        <button
                            class="btn btn-outline-danger btn-sm"
                            id="clearBtn"
                            title="Delete all text from the input field to start over."
                            aria-label="Clear input text"
                        >
                            <svg
                                xmlns="http://www.w3.org"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-trash3"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
                                />
                            </svg>
                            Clear
                        </button>

                        <!-- Magic Fix Button -->
                        <button
                            class="btn btn-outline-info btn-sm"
                            id="magicFixBtn"
                            title="Clean up text formatting by removing unnecessary line breaks and multiple spaces (best for PDF copies)."
                            aria-label="Fix text formatting"
                        >
                            <svg
                                xmlns="http://www.w3.org"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-magic"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M9.5 2.672a.5.5 0 1 0 1 0V.843a.5.5 0 0 0-1 0zm4.5.035a.5.5 0 0 0-.354.854l1.414 1.415a.5.5 0 1 0 .707-.708l-1.414-1.414a.5.5 0 0 0-.354-.147m.49 5.272a.5.5 0 0 0 .317.483l1.29.37a.5.5 0 0 0 .283-.956l-1.29-.37a.5.5 0 0 0-.6.473m-1.302 3.292a.5.5 0 0 0-.707 0l-1.414 1.414a.5.5 0 1 0 .707.708l1.414-1.414a.5.5 0 0 0 0-.707M8.82 8.82a.5.5 0 0 0 0 .708l.5.5a.5.5 0 0 0 .708 0l2.5-2.5a.5.5 0 0 0 0-.708l-.5-.5a.5.5 0 0 0-.708 0zM5 10.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5"
                                />
                            </svg>
                            Magic Fix
                        </button>

                        <!-- Swap Button -->
                        <button
                            class="btn btn-outline-secondary btn-sm"
                            id="swapBtn"
                            title="Swap the original and converted text or invert the translation direction."
                            aria-label="Swap text"
                        >
                            <svg
                                xmlns="http://www.w3.org"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-arrow-left-right"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    fill-rule="evenodd"
                                    d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5m14-7a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 1 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H14.5a.5.5 0 0 1 .5.5"
                                />
                            </svg>
                            Swap
                        </button>
                    </div>

                    <!-- Gruppe 2: Senden -->
                    <!-- Send Button -->
                    <button
                        class="btn btn-primary"
                        id="sendBtn"
                        title="Transfer the current text to DeepL to start the translation or improvement process."
                        aria-label="Send to DeepL"
                    >
                        <svg
                            xmlns="http://www.w3.org"
                            width="16"
                            height="16"
                            fill="currentColor"
                            class="bi bi-send-fill me-1"
                            viewBox="0 0 16 16"
                        >
                            <path
                                d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.001.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"
                            />
                        </svg>
                        Send to DeepL
                    </button>
                </div>

                <div id="status" class="text-muted mb-3"></div>
                <div id="downloadSection" class="d-none">
                    <div class="alert alert-success">Your text has been successfully converted.</div>
                    <h5>Download options:</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" data-format="txt">TXT</button>
                        <button class="btn btn-outline-primary" data-format="docx">Word (DOCX)</button>
                        <button class="btn btn-outline-primary" data-format="pdf">PDF</button>
                    </div>
                </div>
            </div>

            <!-- History Page -->
            <div class="tab-pane fade" id="history" role="tabpanel">
                <h5>History of conversions</h5>
                <div id="historyList"></div>
            </div>

            <!-- Loop Management Page -->
            <div class="tab-pane fade" id="loop" role="tabpanel">
                <h5>Batch Translator</h5>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="mainEntryInput" placeholder="New main entry..." />
                    <button class="btn btn-primary" id="addLoop">Add Entry</button>
                </div>
                <div id="entriesContainer"></div>
            </div>
        </div>

        <!-- Bootstrap JavaScript -->
        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="popup.js" defer></script>
        <script src="loop.js" defer></script>
    </body>
</html>
