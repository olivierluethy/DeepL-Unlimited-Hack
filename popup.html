<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>DeepL Unlimited</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        width: 450px;
        padding: 20px;
      }
      textarea {
        resize: vertical;
      }
      .history-entry,
      .loop-entry {
        border: 1px solid #dee2e6;
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .history-entry pre,
      .loop-entry pre {
        max-height: 100px;
        overflow-y: auto;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h2 class="mb-4 text-primary">DeepL Unlimited</h2>

    <!-- Tab Navigation -->
    <ul class="nav nav-tabs mb-3" id="appTabs" role="tablist">
      <li class="nav-item">
        <a
          class="nav-link active"
          id="main-tab"
          data-bs-toggle="tab"
          href="#main"
          role="tab"
          >Hauptseite</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          id="loop-tab"
          data-bs-toggle="tab"
          href="#loop"
          role="tab"
          >Loop-Konvertierung</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          id="history-tab"
          data-bs-toggle="tab"
          href="#history"
          role="tab"
          >Verlauf</a
        >
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Main Page -->
      <div class="tab-pane fade show active" id="main" role="tabpanel">
        <div class="mb-3">
          <label for="inputText" class="form-label">Text eingeben:</label>
          <textarea
            class="form-control"
            id="inputText"
            rows="6"
            placeholder="Füge hier deinen Text ein..."
          ></textarea>
        </div>
        <button class="btn btn-primary mb-3" id="sendBtn">
          An DeepL senden
        </button>
        <div id="status" class="text-muted mb-3"></div>
        <div id="downloadSection" class="d-none">
          <div class="alert alert-success">
            Ihr Text wurde erfolgreich konvertiert.
          </div>
          <h5>Download-Optionen:</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" data-format="txt">
              TXT
            </button>
            <button class="btn btn-outline-primary" data-format="docx">
              Word (DOCX)
            </button>
            <button class="btn btn-outline-primary" data-format="pdf">
              PDF
            </button>
          </div>
        </div>
      </div>

      <!-- History Page -->
      <div class="tab-pane fade" id="history" role="tabpanel">
        <h5>Verlauf der Konvertierungen</h5>
        <div id="historyList"></div>
      </div>

      <!-- Loop Management Page -->
      <div class="tab-pane fade" id="loop" role="tabpanel">
        <h5>Loop-Konvertierung</h5>

        <div class="input-group">
          <input
            type="text"
            id="mainEntryInput"
            placeholder="Neuer Haupteintrag..."
          />
          <button class="btn-primary" id="addLoop">Eintrag hinzufügen</button>
        </div>

        <div id="entriesContainer"></div>
      </div>
    </div>

    <!-- Bootstrap JavaScript (lokal) -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="popup.js" defer></script>
    <script src="loop.js" defer></script>
  </body>
</html>
