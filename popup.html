<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>DeepL Unlimited</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        width: 600px;
        padding: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .loop-entry {
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        background-color: #f8f9fa;
        transition: box-shadow 0.2s;
      }
      .loop-entry:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .entry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .entry-header h3 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .sub-entry {
        margin: 10px 0;
        padding: 10px;
        border-left: 3px solid #0d6efd;
        background-color: #fff;
        border-radius: 4px;
      }
      .sub-entry-text {
        max-height: none; /* Keine Begrenzung mehr */
        overflow: visible; /* Vollständig anzeigen */
        position: relative;
        font-size: 1rem; /* etwas größere Schrift für bessere Lesbarkeit */
        line-height: 1.4;
        white-space: normal; /* Zeilenumbruch normal */
      }
      .sub-entry-text.expanded {
        max-height: none;
      }
      .sub-entry-text.expanded::after {
        display: none;
      }
      .toggle-text {
        color: #0d6efd;
        cursor: pointer;
        font-size: 0.85rem;
        margin-top: 5px;
        display: inline-block;
      }
      .input-group textarea {
        resize: vertical;
        min-height: 60px;
      }
      .actions button {
        margin-left: 5px;
      }
      #entriesContainer {
        max-height: 400px;
        overflow-y: auto;
        padding-right: 10px;
      }
      .view-page-btn {
        background: linear-gradient(135deg, #0d6efd, #6610f2);
        color: #fff;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        padding: 0.45rem 1.2rem;
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        font-size: 0.9rem;
      }

      .view-page-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        filter: brightness(1.1);
      }

      .view-page-btn:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      }

      .view-page-btn:focus {
        outline: none;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-primary mb-0">DeepL Unlimited</h2>
      <button class="btn btn-primary btn-lg view-page-btn">View on page</button>
    </div>

    <!-- Tab Navigation -->
    <ul class="nav nav-tabs mb-3" id="appTabs" role="tablist">
      <li class="nav-item">
        <a
          class="nav-link active"
          id="main-tab"
          data-bs-toggle="tab"
          href="#main"
          role="tab"
          >Main Page</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          id="loop-tab"
          data-bs-toggle="tab"
          href="#loop"
          role="tab"
          >Loop Conversion</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          id="history-tab"
          data-bs-toggle="tab"
          href="#history"
          role="tab"
          >History</a
        >
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
      <!-- Main Page -->
      <div class="tab-pane fade show active" id="main" role="tabpanel">
        <div class="mb-3">
          <label for="inputText" class="form-label">Enter text:</label>
          <textarea
            class="form-control"
            id="inputText"
            rows="6"
            placeholder="Enter your text here..."
          ></textarea>
        </div>
        <button class="btn btn-primary mb-3" id="sendBtn">
          Send to DeepL
        </button>
        <div id="status" class="text-muted mb-3"></div>
        <div id="downloadSection" class="d-none">
          <div class="alert alert-success">
            Your text has been successfully converted.
          </div>
          <h5>Download options:</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" data-format="txt">
              TXT
            </button>
            <button class="btn btn-outline-primary" data-format="docx">
              Word (DOCX)
            </button>
            <button class="btn btn-outline-primary" data-format="pdf">
              PDF
            </button>
          </div>
        </div>
      </div>

      <!-- History Page -->
      <div class="tab-pane fade" id="history" role="tabpanel">
        <h5>History of conversions</h5>
        <div id="historyList"></div>
      </div>

      <!-- Loop Management Page -->
      <div class="tab-pane fade" id="loop" role="tabpanel">
        <h5>Loop Conversion</h5>
        <div class="input-group mb-3">
          <input
            type="text"
            class="form-control"
            id="mainEntryInput"
            placeholder="New main entry..."
          />
          <button class="btn btn-primary" id="addLoop">
            Add Entry
          </button>
        </div>
        <div id="entriesContainer"></div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="popup.js" defer></script>
    <script src="loop.js" defer></script>
  </body>
</html>
