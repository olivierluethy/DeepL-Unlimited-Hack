<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <title>DeepL Pro Unlimited</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <!-- Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />

        <script src="js/jspdf.umd.min.js" defer></script>
        <script src="js/pdf.min.js" defer></script>
        <script src="js/docx-utils.js" defer></script>

        <style>
            body {
                width: 600px;
                padding: 20px;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }
            .input-group textarea {
                resize: vertical;
                min-height: 60px;
            }
            .view-page-btn {
                background: linear-gradient(135deg, #0d6efd, #6610f2);
                color: #fff;
                font-weight: 600;
                border: none;
                border-radius: 50px;
                padding: 0.45rem 1.2rem;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s,
                    filter 0.2s;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
                font-size: 0.9rem;
            }

            .view-page-btn:hover {
                transform: translateY(-2px) scale(1.02);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
                filter: brightness(1.1);
            }

            .view-page-btn:active {
                transform: translateY(1px) scale(0.98);
                box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            }

            .view-page-btn:focus {
                outline: none;
                box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.3);
            }
            .history-entry pre {
                background-color: #f8f9fa;
                border: 1px solid #e9ecef;
                border-radius: 4px;
                padding: 8px;
                font-size: 0.85rem;
                white-space: pre-wrap;
                word-wrap: break-word;
                max-height: 150px;
                overflow-y: auto;
            }

            /* Progress Bar Styles */
            .progress-wrapper {
                transition: opacity 0.3s ease;
            }
            .progress-wrapper.fade {
                opacity: 0;
            }
            .progress {
                border-radius: 4px;
                overflow: hidden;
            }
            .progress-bar {
                transition: width 0.3s ease;
            }

            /* Sub-input wrapper animation */
            .sub-input-wrapper {
                transition:
                    opacity 0.3s ease,
                    transform 0.3s ease;
            }
            .sub-input-wrapper.d-none {
                opacity: 0;
                transform: translateY(-10px);
            }
            .sub-input-wrapper.show {
                opacity: 1;
                transform: translateY(0);
            }

            /* Entry animation */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Toast notification */
            .custom-toast {
                animation: slideIn 0.3s ease;
            }

            /* Focus styles for inputs */
            .sub-input:focus {
                border-color: #0d6efd;
                box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
            }

            /* Responsive button groups */
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
            }

            /* Placeholder styling */
            .sub-input::placeholder {
                color: #6c757d;
                font-style: italic;
            }

            /* History multi-selection */
            .history-entry.selected {
                background-color: #e8f0fe;
                outline: 2px solid #0d6efd;
                outline-offset: -2px;
                border-radius: 6px;
            }
            .history-select-cb {
                width: 1.1em;
                height: 1.1em;
                cursor: pointer;
                flex-shrink: 0;
                accent-color: #0d6efd;
                margin-top: 5px;
                align-self: flex-start;
            }
            #historyBulkBar {
                position: sticky;
                bottom: 0;
                z-index: 10;
                background: #fff;
                border-top: 2px solid #0d6efd;
                padding: 7px 4px 5px;
                margin-top: 6px;
                border-radius: 0 0 4px 4px;
                animation: slideIn 0.2s ease;
            }
            /* Discord highlight banner — gradient + glow can't be done with Bootstrap utilities */
            .discord-banner {
                background: linear-gradient(135deg, #5865f2, #7289ff);
                transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease;
                animation: discordPulse 2.5s infinite;
            }
            .discord-banner:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 30px rgba(88, 101, 242, 0.45) !important;
            }
            .discord-icon-box {
                width: 52px;
                height: 52px;
                flex: 0 0 52px;
            }
            @keyframes discordPulse {
                0%,
                100% {
                    box-shadow: 0 8px 25px rgba(88, 101, 242, 0.35);
                }
                50% {
                    box-shadow:
                        0 10px 28px rgba(88, 101, 242, 0.5),
                        0 0 20px rgba(88, 101, 242, 0.35);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .discord-banner {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2 class="text-primary mb-0 fw-bold">DeepL Pro Unlimited</h2>

            <div class="d-flex gap-2">
                <!-- Report Bug Button -->
                <button
                    id="bugBtn"
                    class="btn btn-outline-danger btn-sm d-flex align-items-center gap-2"
                    title="Report a bug"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Report a bug"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        fill="currentColor"
                        class="bi bi-bug-fill"
                        viewBox="0 0 16 16"
                    >
                        <path
                            d="M4.978.855a.5.5 0 1 0-.956.29l.41 1.352A5 5 0 0 0 3 6c0 .546.087 1.072.249 1.569L2.05 8.038a.5.5 0 1 0-.22.975l1.378-.313A5.04 5.04 0 0 0 3.5 10c0 .405.048.801.14 1.182l-1.002.501a.5.5 0 0 0 .447.894l1.002-.501c.204.423.473.805.795 1.14l-.838.838a.5.5 0 0 0 .708.708l.838-.838c.451.344.96.611 1.517.777l-.271 1.204a.5.5 0 1 0 .975.22l.27-.1204c.54.08 1.096.08 1.636 0l.27 1.204a.5.5 0 1 0 .975-.22l-.272-1.204c.558-.166 1.066-.433 1.517-.777l.838.838a.5.5 0 0 0 .708-.708l-.838-.838c.322-.335.591-.717.795-1.14l1.002.501a.5.5 0 0 0 .447-.894l-1.002-.501c.092-.381.14-.777.14-1.182 0-.342-.034-.676-.1-.1l1.378.313a.5.5 0 1 0-.22-.975l-1.199-.269A5 5 0 0 0 13 6a5 5 0 0 0-1.432-3.503l.41-1.352a.5.5 0 1 0-.956-.29l-.322 1.056A5 5 0 0 0 8 1a5 5 0 0 0-2.702.798zM5 6a3 3 0 1 1 6 0v3a3 3 0 1 1-6 0z"
                        />
                    </svg>
                    <span>Bug</span>
                </button>

                <!-- Feature Request Button -->
                <button
                    id="featureBtn"
                    class="btn btn-outline-info btn-sm d-flex align-items-center gap-2"
                    title="Request a feature"
                    data-bs-toggle="tooltip"
                    data-bs-placement="bottom"
                    data-bs-title="Request a feature"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        fill="currentColor"
                        class="bi bi-lightbulb-fill"
                        viewBox="0 0 16 16"
                    >
                        <path
                            d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13h-5a.5.5 0 0 1-.46-.302l-.761-1.77a1.96 1.96 0 0 0-.453-.618A5.98 5.98 0 0 1 2 6m3 8.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5"
                        />
                    </svg>
                    <span>Feature</span>
                </button>
            </div>
        </div>

        <!-- Discord Highlight Banner -->
        <a
            id="discordBtn"
            href="https://discord.gg/YknacSdbgg"
            target="_blank"
            rel="noopener noreferrer"
            class="discord-banner d-flex align-items-center text-white text-decoration-none rounded-4 p-3 mb-4"
            aria-label="Join our Discord Server"
        >
            <div
                class="discord-icon-box d-flex align-items-center justify-content-center rounded-3 bg-white bg-opacity-25 me-3"
            >
                <i class="bi bi-discord fs-3"></i>
            </div>

            <div class="flex-grow-1">
                <div class="fw-bold fs-6 lh-sm">Join our Discord Server</div>
                <div class="small opacity-75">Updates • Support • Community</div>
            </div>

            <span class="badge rounded-pill bg-white fw-bold ms-2" style="color: #5865f2">LIVE</span>
        </a>

        <!-- Tab Navigation -->
        <ul class="nav nav-tabs mb-3" id="appTabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="main-tab" data-bs-toggle="tab" href="#main" role="tab"
                    ><i class="bi bi-house-door-fill"></i> Main</a
                >
            </li>
            <li class="nav-item">
                <a class="nav-link" id="history-tab" data-bs-toggle="tab" href="#history" role="tab"
                    ><i class="bi bi-clock-history"></i> History</a
                >
            </li>
            <li class="nav-item">
                <a class="nav-link" id="pdf-tab" data-bs-toggle="tab" href="#pdf" role="tab"
                    ><i class="bi bi-file-earmark-text"></i> Documents</a
                >
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Main Page -->

            <div class="tab-pane fade show active" id="main" role="tabpanel">
                <div class="mb-3">
                    <h5 for="inputText" class="form-label">
                        Enter text
                        <i
                            class="bi bi-info-circle"
                            data-bs-toggle="tooltip"
                            data-bs-title="Enter or paste text and click 'Send to DeepL' to start the translation."
                            style="cursor: help"
                        >
                        </i>
                    </h5>
                    <textarea
                        class="form-control"
                        id="inputText"
                        rows="6"
                        placeholder="Enter your text here..."
                    ></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <!-- Text Tools Group -->
                    <div class="d-flex gap-1">
                        <!-- Paste Button -->
                        <button
                            class="btn btn-outline-secondary btn-sm"
                            id="pasteBtn"
                            title="Paste text from your clipboard directly into the input field."
                            aria-label="Paste text from clipboard"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-clipboard-plus"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    fill-rule="evenodd"
                                    d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7z"
                                />
                                <path
                                    d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"
                                />
                                <path
                                    d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"
                                />
                            </svg>
                            Paste
                        </button>

                        <!-- Copy Button -->
                        <button
                            class="btn btn-outline-secondary btn-sm"
                            id="copyInputBtn"
                            title="Copy the current content of the input field to your clipboard."
                            aria-label="Copy input text"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-clipboard"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"
                                />
                                <path
                                    d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"
                                />
                            </svg>
                            Copy
                        </button>

                        <!-- Clear Button -->
                        <button
                            class="btn btn-outline-danger btn-sm"
                            id="clearBtn"
                            title="Delete all text from the input field to start over."
                            aria-label="Clear input text"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-trash3"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
                                />
                            </svg>
                            Clear
                        </button>

                        <!-- Magic Fix Button -->
                        <button
                            class="btn btn-outline-info btn-sm"
                            id="magicFixBtn"
                            title="Clean up text formatting by removing unnecessary line breaks and multiple spaces (best for PDF copies)."
                            aria-label="Fix text formatting"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-magic"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M9.5 2.672a.5.5 0 1 0 1 0V.843a.5.5 0 0 0-1 0zm4.5.035a.5.5 0 0 0-.354.854l1.414 1.415a.5.5 0 1 0 .707-.708l-1.414-1.414a.5.5 0 0 0-.354-.147m.49 5.272a.5.5 0 0 0 .317.483l1.29.37a.5.5 0 0 0 .283-.956l-1.29-.37a.5.5 0 0 0-.6.473m-1.302 3.292a.5.5 0 0 0-.707 0l-1.414 1.414a.5.5 0 1 0 .707.708l1.414-1.414a.5.5 0 0 0 0-.707M8.82 8.82a.5.5 0 0 0 0 .708l.5.5a.5.5 0 0 0 .708 0l2.5-2.5a.5.5 0 0 0 0-.708l-.5-.5a.5.5 0 0 0-.708 0zM5 10.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5m0-2a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5"
                                />
                            </svg>
                            Magic Fix
                        </button>

                        <!-- Swap Button -->
                        <button
                            class="btn btn-outline-secondary btn-sm"
                            id="swapBtn"
                            title="Swap the original and converted text or invert the translation direction."
                            aria-label="Swap text"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="14"
                                height="14"
                                fill="currentColor"
                                class="bi bi-arrow-left-right"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    fill-rule="evenodd"
                                    d="M1 11.5a.5.5 0 0 0 .5.5h11.793l-3.147 3.146a.5.5 0 0 0 .708.708l4-4a.5.5 0 0 0 0-.708l-4-4a.5.5 0 0 0-.708.708L13.293 11H1.5a.5.5 0 0 0-.5.5m14-7a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 1 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 4H14.5a.5.5 0 0 1 .5.5"
                                />
                            </svg>
                            Swap
                        </button>
                    </div>

                    <!-- Send Button -->
                    <button
                        class="btn btn-primary"
                        id="sendBtn"
                        title="Transfer the current text to DeepL to start the translation or improvement process."
                        aria-label="Send to DeepL"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="16"
                            height="16"
                            fill="currentColor"
                            class="bi bi-send-fill me-1"
                            viewBox="0 0 16 16"
                        >
                            <path
                                d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.001.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z"
                            />
                        </svg>
                        Send to DeepL
                    </button>
                </div>

                <div id="status" class="text-muted mb-3"></div>
                <div id="downloadSection" class="d-none">
                    <div class="alert alert-success">Your text has been successfully converted.</div>
                    <h5>Download options:</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" data-format="txt">TXT</button>
                        <button class="btn btn-outline-primary" data-format="docx">Word (DOCX)</button>
                        <button class="btn btn-outline-primary" data-format="pdf">PDF</button>
                    </div>
                </div>
            </div>

            <!-- History Page -->
            <div class="tab-pane fade" id="history" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0">
                        History of conversions
                        <i
                            class="bi bi-info-circle"
                            style="cursor: help"
                            data-bs-toggle="tooltip"
                            data-bs-placement="top"
                            data-bs-title="View, copy, or delete previous translations."
                        ></i>
                    </h5>
                    <button
                        id="selectAllHistoryBtn"
                        class="btn btn-link btn-sm p-0 d-none"
                        style="font-size: 0.8rem; color: #6c757d; text-decoration: none"
                    >
                        Select all
                    </button>
                </div>
                <div id="historyBulkBar" class="d-none">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <span id="selectedCount" class="small text-primary fw-semibold me-auto"></span>
                        <button id="bulkCopyBtn" class="btn btn-sm btn-outline-success d-flex align-items-center gap-1">
                            <i class="bi bi-clipboard"></i> Copy
                        </button>
                        <div class="dropdown">
                            <button
                                class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1"
                                type="button"
                                data-bs-toggle="dropdown"
                            >
                                <i class="bi bi-download"></i> Export
                            </button>
                            <ul class="dropdown-menu shadow-sm" style="font-size: 0.8rem">
                                <li>
                                    <a class="dropdown-item" href="#" id="bulkExportTxt"
                                        ><i class="bi bi-file-text me-1"></i>TXT</a
                                    >
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#" id="bulkExportWord"
                                        ><i class="bi bi-file-word me-1"></i>Word (.docx)</a
                                    >
                                </li>
                            </ul>
                        </div>
                        <button
                            id="bulkDeleteBtn"
                            class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1"
                        >
                            <i class="bi bi-trash"></i> Del
                        </button>
                    </div>
                </div>
                <div id="historyList"></div>
            </div>

            <!-- PDF Translation Page -->
            <div class="tab-pane fade" id="pdf" role="tabpanel">
                <div class="text-center pb-3 px-2">
                    <button id="openFullPageBtn" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-box-arrow-up-right me-1"></i>Open Full Page
                    </button>
                </div>
                <div class="px-2 pt-3 pb-2">
                    <!-- Pending uploads (rendered from chrome.storage.local.pendingDocuments) -->
                    <div id="pendingDocsList" class="mb-3"></div>
                    <div id="pendingDocsEmpty" class="text-center text-muted small py-3 d-none">
                        <i class="bi bi-inbox fs-3 d-block mb-1 text-secondary"></i>
                        No uploads waiting. Open the full page to add a PDF file.
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JavaScript -->
        <script src="js/bootstrap.bundle.min.js"></script>
        <script src="js/buckets.js" defer></script>
        <script src="js/deepl-utils.js" defer></script>
        <script src="track.js" defer></script>
        <script src="popup.js" defer></script>
    </body>
</html>
